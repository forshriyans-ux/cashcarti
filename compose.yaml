services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: permitproof
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: permitproof
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - permitproof_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U permitproof -d permitproof']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  permitproof_db:
